# Cloudflare Workers config — УчЛист backend.
#
# Deploy:    npm run deploy        → ПРОДАКШН (--env production)
# Dev local: npm run dev   (wrangler dev --local)
#
# ВНИМАНИЕ, и это не теория. Верхнеуровневая секция и секция [env.production]
# описывают РАЗНЫЕ воркеры: верхняя — `rabochielisty-api-dev`, продовая —
# `rabochielisty-api`. Раньше имя было одинаковым, и `wrangler deploy` без
# `--env production` выкатывал боевой адрес с development-переменными:
# ALLOW_DEV_MAGIC_URL=true, ALLOW_DEMO_PAYMENTS=true. Так случилось дважды:
# 02.10.2026 и 04.10.2026. Теперь «голый» `wrangler deploy` физически не может
# выкатить воркер `rabochielisty-api` — он создаёт/обновляет отдельный
# dev-воркер, а прод живёт только под `--env production`.
#
# Скрипта `deploy:staging` больше нет: `wrangler deploy` без окружения —
# это ровно тот путь, которым прод дважды выкатывали с настройками разработки.
# Если понадобится отдельный стенд, у него должен быть СВОЙ воркер, СВОЯ база
# D1 и свой бакет R2 — см. `docs/agents/03-deploy-prod-cloudflare.md`.
#
# Secrets (.dev.vars для локала, wrangler secret put для прода):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, OPENROUTER_API_KEY,
#   RESEND_API_KEY, YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY, JWT_SECRET,
#   FINGERPRINT_SALT.
#
# При первом деплое:
#   1. wrangler d1 create rabochielisty       → подставить database_id ниже
#   2. wrangler r2 bucket create rabochielisty-pdfs
#   3. wrangler secret put <KEY> --env production  → для каждого секрета
#   4. npm run db:migrate:prod
#   5. npm run deploy

name = "rabochielisty-api-dev"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Локальные/дефолтные переменные. Перекрываются [env.production] для прода.
# database_id ниже — PLACEHOLDER, реальный id создаётся через `wrangler d1 create rabochielisty`
# и подставляется сюда перед первым деплоем.

[vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:3000"
# ОДИН origin для ссылок, которые видит человек (magic-link, возврат с оплаты).
# Отдельная переменная нужна потому, что FRONTEND_URL в проде — список через
# запятую ради CORS, и вставлять его в ссылку нельзя.
APP_PUBLIC_URL = "http://localhost:3000"
# Явные разрешения на режимы, которые нельзя включать по умолчанию НИГДЕ,
# включая прод. Именно «включено», а не «не запрещено»: 02.10.2026 выяснилось,
# что боевой воркер задеплоен из секции [vars], поэтому защита, построенная на
# APP_ENV, выключалась молча.
#
# Эти два флага нужны локальной разработке: без них нельзя войти на машине
# (почты нет, ссылка для входа приходит в ответе) и нельзя проверить оплату.
# Верхнеуровневая секция обслуживает локальную разработку, поэтому флаги
# остаются включёнными.
#
# На опубликованном воркере с ALLOW_DEV_MAGIC_URL=true или
# ALLOW_DEMO_PAYMENTS=true изменяющие ручки отвечают 503 — см.
# `unsafeConfigurationGuard` в `src/index.ts`. Прод выкатывается только с
# `--env production`, где оба флага выключены явно.
ALLOW_DEV_MAGIC_URL = "true"
ALLOW_DEMO_PAYMENTS = "true"
# ТЗ-20: локально рекуррент проверяем, в проде он выключен до разрешения
# менеджера ЮKassa и успешного теста на тестовой карте.
RECURRING_BILLING_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "rabochielisty"
database_id = "fb8cc87f-4b51-4994-8d26-af366b448ebe"
migrations_dir = "src/db"

# Preview-ресурсы для `wrangler dev --remote` (09.10.2026). Без них wrangler
# отказывается запускать удалённый dev: правило «в development не трогай
# прод-ресурсы» блокирует всё, включая живой прогон генерации
# (scripts/live-gen-check.ts). Прод-база и прод-бакет не затрагиваются.
preview_database_id = "9ed06f58-e5cc-4bc2-8b99-5b355a06a8ce"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "rabochielisty-pdfs"
preview_bucket_name = "uchlist-preview"

# Продакшн-окружение: отдельные URL, тот же набор ресурсов.
[env.production]
name = "rabochielisty-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.production.vars]
APP_ENV = "production"
APP_BASE_URL = "https://rabochielisty-api.ivanlusnikov159.workers.dev"
# ✅ 2026-10-07: uchlist.ru куплен и делегирован на Cloudflare, домен привязан
# к Pages-проекту. Первым в списке стоит продовый домен — на него падают и
# CORS/CSRF-allowlist, и fallback'и (FRONTEND_URL.split(",")[0]) в местах,
# где APP_PUBLIC_URL не задан. pages.dev оставлен на переходный период,
# пока старый хост отдаёт 301. rabochielisty.ru удалён: домен не резолвится.
FRONTEND_URL = "https://uchlist.ru,https://www.uchlist.ru,https://listai-prototype.pages.dev,https://www.listai-prototype.pages.dev"
# Прод-домен ОДНИМ значением — в magic-link письмо уходит именно он.
# ✅ 2026-10-07 переведён на https://uchlist.ru: письма для входа в кабинет
# уходят на продовый домен, редиректы после оплаты — тоже.
APP_PUBLIC_URL = "https://uchlist.ru"
# В проде оба опасных режима выключены ЯВНО, а не «по умолчанию из коробки».
# Если кто-то добавит новую секцию окружения, отсутствие этих строк ничего
# не сломает: поведение по умолчанию везде — запрет.
ALLOW_DEV_MAGIC_URL = "false"
ALLOW_DEMO_PAYMENTS = "false"
# Рекуррент НЕ включаем, пока менеджер ЮKassa не разрешит автоплатежи на
# боевом магазине и не пройдёт тест на тестовой карте (см. env.ts).
RECURRING_BILLING_ENABLED = "false"
# ✅ 2026-10-12: cookie сессии уходит на .uchlist.ru, а не на хост воркера.
# Раньше cookie жила на `*.workers.dev`, то есть была «чужой» для uchlist.ru.
# Safari, Firefox и Chrome с Privacy Sandbox такие cookie не передают: вход
# проходит, сессия в базе живая, а любой запрос к бэку получает 401. Воспроизведено
# на живом сайте 12.10.2026.
#
# Теперь бэк живёт на собственном домене api.uchlist.ru (custom domain воркера),
# cookie становится first-party для uchlist.ru, браузеры её не трогают, а
# SameSite в auth.ts автоматически переключается на Lax (безезопаснее, чем None).
#
# ПЕРЕКЛЮЧЕНИЕ ДОЛЖНО БЫТЬ СОВМЕСТНЫМ: эту переменную нельзя выкатывать, пока
# NEXT_PUBLIC_API_URL на фронте ещё указывает на workers.dev — тогда cookie уйдёт
# на .uchlist.ru, а запросы придут на workers.dev, и все разлогинятся. То же самое
# касается NEXT_PUBLIC_API_URL на фронте — см. .github/workflows/deploy.yml.
SESSION_COOKIE_DOMAIN = ".uchlist.ru"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rabochielisty"
database_id = "fb8cc87f-4b51-4994-8d26-af366b448ebe"
migrations_dir = "src/db"

[[env.production.r2_buckets]]
binding = "PDFS"
bucket_name = "rabochielisty-pdfs"

# TZ-11 §5.2 (В-2.3): фото тетради — персональные данные ребёнка, срок хранения
# 7 дней. Без этого триггера `delete_at` в D1 не исполняется и фото лежат
# бессрочно. Раз в сутки в 03:00 UTC — фото удаляются воркером, даже если
# учитель ни разу не открыл дашборд.
[env.production.triggers]
# Два триггера: суточная уборка (фото тетрадей, ответы учеников) и часовой
# для биллинга — помесячная подписка не должна «протухать» на сутки после
# даты списания. Обработчик разводит их по event.cron в src/index.ts.
crons = ["0 3 * * *", "0 * * * *"]
