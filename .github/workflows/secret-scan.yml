name: Secret Scan

# Поиск утёкших ключей в коде и в истории.
#
# Зачем: вручную проверить ключи невозможно — их легко не заметить в diff'e,
# а в историю они попадают навсегда. Проверено 2 октября 2026: в текущем коде
# и истории секретов нет, то есть в момент запуска скан был зелёным. Задача
# этого сканера — не «найти старое», а не дать появиться новому.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (полная история)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Отчёты прикладываются к PR, чтобы утечка была видна ревьюеру,
          # а не только в логах Actions.
          args: --redact --verbose
