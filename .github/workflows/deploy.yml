name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Least privilege. Без этого блока GITHUB_TOKEN получает права по
    # умолчанию (write на содержимое репозитория) на весь job, который
    # трогает прод. Здесь job только читает код и умеет задеплоить —
    # больше ему ничего не нужно.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Wrangler требует Node ≥22 (был 20 — CI падал на deploy). Локально Next 14.2 + Node 23 виснет на M2 Air → собираем в CI.
          cache: npm

      - name: Install
        run: npm ci --no-fund

      # Проверки блокирующие. Раньше их не было вовсе, и в прод уезжал код,
      # который мог не проходить даже typecheck.
      #
      # Первое время они были предупреждениями: дерево содержало незавершённую
      # работу, и блокировка останавливала бы выкатку целиком. С 2 октября 2026
      # дерево зелёное (tsc — 0 ошибок, 338/338 тестов), и предупреждения
      # больше не нужны: неисправный код в прод не должен попадать молча.
      - name: Typecheck
        run: npm run typecheck

      # Без `--environment node`: фронт по умолчанию работает в jsdom, и
      # подмена окружения роняет все React-тесты (168 вместо 17 падений).
      - name: Test
        run: npx vitest run

      # Явная проверка зависимостей. Флаг --no-audit в `npm ci` убран:
      # аудит должен быть видимым шагом, а не молчаливым пропуском.
      # Остаётся предупреждением: на next 14.2.35 висит 1 critical + 5 high,
      # и блокировка остановила бы релиз до апгрейда. Применимость advisory
      # разобрана — статическому экспорту они неприменимы
      # (docs/SECURITY-REVIEW-2026-10-02.md, С-4). Апгрейд next отклонил владелец.
      - name: Audit dependencies (warning only)
        run: npm audit --audit-level=high || echo "::warning::npm audit нашёл уязвимости — см. лог"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # ТЗ-21 п.1: здесь и в .env.example должно стоять одно и то же значение,
          # иначе карта сайта и canonical собираются с одного домена, а бандл
          # едет с другого. Канонический домен по умолчанию (src/lib/site.ts) —
          # https://uchlist.ru.
          #
          # ✅ 2026-10-07: uchlist.ru куплен и делегирован на Cloudflare, домен привязан
          # к Pages-проекту. Раньше здесь намеренно стоял pages.dev: собирать с
          # нерезолвящимся хостом нельзя — sitemap.xml, robots.txt, canonical и
          # og:image поедут на мёртвый домен, и поисковик перестанет обходить
          # сайт. Блок 301 в public/_redirects раскомментирован в тот же день.
          NEXT_PUBLIC_SITE_URL: https://uchlist.ru
          # Адрес API-воркера для СБОРКИ фронта. Не секрет — это публичный
          # домен воркера, именно он зашивается в бандл (process.env.* читается
          # на этапе сборки, не в рантайме).
          #
          # 3 октября 2026: переменной здесь не было вообще. Фронт собирался с
          # NEXT_PUBLIC_API_URL = "" и на живом сайте не ходил в бэк ни одним
          # запросом: src/lib/auth/api.ts кидал NO_API_URL («вход не работает»),
          # а src/lib/llm/index.ts уходил в локальный мок — учитель получал
          # правдоподобный, но выдуманный лист. Проверяется так: в бандле
          # pages.dev/_next/static/chunks/... должен встречаться этот домен.
          NEXT_PUBLIC_API_URL: https://rabochielisty-api.ivanlusnikov159.workers.dev
          # Реквизиты оператора ПДн — уходят в публичную оферту и в согласие
          # на обработку персональных данных. Без ФИО+адреса согласие
          # недействительно по ч. 4 ст. 9 152-ФЗ (штраф 300–700 тыс. ₽).
          # Секреты в GitHub: Settings → Secrets and variables → Actions.
          NEXT_PUBLIC_OPERATOR_NAME: ${{ secrets.NEXT_PUBLIC_OPERATOR_NAME }}
          NEXT_PUBLIC_OPERATOR_INN: ${{ secrets.NEXT_PUBLIC_OPERATOR_INN }}
          NEXT_PUBLIC_OPERATOR_ADDRESS: ${{ secrets.NEXT_PUBLIC_OPERATOR_ADDRESS }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # CLOUDFLARE_ACCOUNT_ID — публичный ID аккаунта (см. .env.example), не секрет.
          CLOUDFLARE_ACCOUNT_ID: 9fe2955fcf08aecf91754823a7aae0aa
          CF_PAGES_PROJECT: listai-prototype
        # 2026-09-30: --branch=main делает deploy в production-environment (production_branch='main'),
        # а не в preview (по умолчанию wrangler создаёт preview даже для Direct Upload, и custom
        # domain не активируется). Без --branch → preview. С --branch=main + production_branch=main → production.
        run: npx --yes wrangler pages deploy out --project-name=listai-prototype --commit-dirty=true --branch=main

  # Бэкенд (Cloudflare Worker rabochielisty-api) жил отдельно от Pages и
  # не деплоился из CI — правки в backend/ попадали на прод только вручную.
  # Теперь бэкенд деплоится тут же, после успешной сборки фронта.
  #
  # Джоб был временно ограничен ручным запуском, пока у воркера не было
  # RESEND_API_KEY: без него переход на [env.production.vars] не закрывал бы
  # дыру, а выключал вход целиком (ALLOW_DEV_MAGIC_URL там выключен).
  # Секрет задан 2 октября 2026, автодеплой возвращён.
  #
  # ОСТАЁТСЯ НА РУЧНОМ УПРАВЛЕНИИ ОПЛАТА: ключей ЮKassa на воркере нет
  # (ALLOW_DEMO_PAYMENTS="false" в [env.production.vars]), поэтому создание
  # платежа вернёт отказ. Это осознанно: без сверки с API ЮKassa подтвердить
  # платёж нечем, а принимать подписку по подделанному вебхуку нельзя.
  # После подключения ЮKassa:
  #   npx wrangler secret put YOOKASSA_SHOP_ID    --env production
  #   npx wrangler secret put YOOKASSA_SECRET_KEY --env production
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler требует Node >=22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-fund

      # Проверки бэкенда до выкатки. Раньше бэк уезжал на прод без них.
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npx vitest run

      - name: Deploy API Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9fe2955fcf08aecf91754823a7aae0aa
        # --env production ОБЯЗАТЕЛ. Без него wrangler публикует верхнюю
        # секцию [vars] — это конфигурация РАЗРАБОТКИ: APP_ENV=development,
        # FRONTEND_URL=http://localhost:3000, ALLOW_DEV_MAGIC_URL=true,
        # ALLOW_DEMO_PAYMENTS=true. Именно так 2 октября 2026 на прод уехал
        # воркер, который отдавал ссылку для входа в ответе и принимал оплату
        # без сверки с ЮKassa. Прод-конфигурация живёт в [env.production.vars]
        # и при деплое без --env в неё НЕ попадает.
        run: npx --yes wrangler deploy --env production
